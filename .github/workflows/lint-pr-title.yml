name: Lint PR Title

on:
  # Using pull_request (not pull_request_target) intentionally: title-linting
  # needs no base-repo secrets. Do not add a checkout of untrusted PR code here.
  pull_request:
    types: [opened, edited, reopened]

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            test
            docs
            build
            ci
            style
            chore
            revert
