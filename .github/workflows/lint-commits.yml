name: Lint Commits

# Checks every commit in a pull request against Conventional Commits, using the
# same commitlint.config.cjs as the local commit-msg hook. This is the CI half of
# the two-layer enforcement; the client half is the Husky commit-msg hook.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the PR's base..head commit range can be linted.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Lint commits in this PR
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
