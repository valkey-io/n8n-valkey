name: Security

# Static analysis, secret scanning and a dependency audit. Runs on pull
# requests, on pushes to main and weekly, and is called by publish.yml so that
# a release is published only after these checks pass.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Semgrep
        run: semgrep scan --config auto --error --exclude-rule generic.secrets.security.detected-private-key.detected-private-key

  git-secrets:
    name: Git secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install git-secrets 1.3.0
        run: |
          git clone --quiet https://github.com/awslabs/git-secrets.git "$RUNNER_TEMP/git-secrets"
          git -C "$RUNNER_TEMP/git-secrets" checkout --quiet ad82d68ee924906a0401dfd48de5057731a9bc84
          sudo make -C "$RUNNER_TEMP/git-secrets" install
      - name: Scan for AWS credentials
        run: |
          git secrets --register-aws
          git secrets --scan

  npm-audit:
    name: npm audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 'lts/*'
      - name: Audit the shipped dependency tree
        # Audits only this package's runtime dependencies, resolved the way n8n
        # installs a community node: peer dependencies come from n8n, so they
        # are not installed. Dev tooling and n8n's own packages are not shipped,
        # and Dependabot reports their advisories from the repository lockfile.
        # Copying vendor/ is needed only while @langchain/valkey is a vendored
        # tarball.
        run: |
          dir="$RUNNER_TEMP/shipped"
          mkdir -p "$dir"
          cp -R vendor "$dir/"
          jq '{name, version, dependencies}' package.json > "$dir/package.json"
          cd "$dir"
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts
          npm audit --audit-level=high
